[pytest]
addopts = -s -v
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:supabase.*

markers =
    smoke: Маркировка для смок тестов.
    critical: Маркировка для критичных тестов.
    regression: Маркировка для регрессионных тестов.
    registration: Маркировка для тестов на регистрацию.
    authorization: Маркировка для тестов на авторизацию.
    navbar: Маркировка для тестов навигационной панели.
    admin_panel: Маркировка для тестов страницы администратора.
    dashboard: Маркировка для тестов страницы панели управления.
    toolbar: Маркировка для тестов тулбара.
    task_list: Маркировка для тестов списка задач.
    task_form: Маркировка для тестов формы задач.
    stat_counters: Маркировка для тестов счетчиков статистики в админке.
    admin_search: Маркировка для тестов поиска в админке.
    not_parallel: Маркировка для тестов, которые нельзя запускать параллельно (зависят от глобального состояния).
