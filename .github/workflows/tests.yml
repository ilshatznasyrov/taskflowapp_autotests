name: UI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create .env file from Secrets
        run: |
          echo "APP_URL=${{ secrets.APP_URL }}" >> .env
          echo "HEADLESS=true" >> .env
          echo 'BROWSERS=["chromium"]' >> .env
          echo 'TEST_USER.EMAIL="${{ secrets.TEST_USER_EMAIL }}"' >> .env
          echo 'TEST_USER.USERNAME="${{ secrets.TEST_USER_USERNAME }}"' >> .env
          echo 'TEST_USER.PASSWORD="${{ secrets.TEST_USER_PASSWORD }}"' >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "DEMO_EMAIL=${{ secrets.DEMO_EMAIL }}" >> .env
          echo "DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}" >> .env
          echo "USER_EMAIL=${{ secrets.USER_EMAIL }}" >> .env
          echo "USER_PASSWORD=${{ secrets.USER_PASSWORD }}" >> .env

      - name: Run tests
        run: |
          mkdir -p allure-results videos tracing
          pytest -n auto -m "not not_parallel" --alluredir=./allure-results
          pytest -m "not_parallel" --alluredir=./allure-results

      - name: Set up Node.js for Allure CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure CLI
        run: npm install -g allure-commandline --silent

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report